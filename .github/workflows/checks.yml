name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pytest==9.0.3 ruff==0.15.20 aiohttp==3.14.1 voluptuous==0.16.0 Pillow==12.3.0
      - run: python -m pytest -q tests
      - run: python -m compileall -q custom_components tests
      - run: python -m ruff check custom_components tests
